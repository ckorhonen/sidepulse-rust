[workspace]
resolver = "2"
members = ["crates/sidepulse-core", "crates/sidepulse-hook", "crates/sidepulse-bar"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ckorhonen/sidepulse-rust"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
socket2 = { version = "0.5", features = ["all"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
